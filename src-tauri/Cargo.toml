[package]
name = "sorakada"
version = "0.1.0"
description = "A modern desktop text editor for programmers."
authors = ["Sorakada contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sorakada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Structural filesystem operations for the Workspace Explorer (003). `trash`
# moves an entry to the OS recycle/trash facility and has no permanent-delete
# fallback, which is what FR-066/FR-067 require. `chrono` is only used for the
# crate's optional `TrashItem` timestamps, so the default feature is dropped and
# the Windows COM apartment is pinned explicitly.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
# Event-driven native filesystem watching for opened documents (005) and the
# future recursive Workspace watch (006). `notify` must stay the only watcher
# stack: no polling loop and no second watcher framework may be added beside it.
notify = "8.2.0"

# The final disk rename must not replace a destination that appeared after
# validation. `std::fs::rename` always replaces on Windows, so the no-replace
# move is issued through `MoveFileExW` without `MOVEFILE_REPLACE_EXISTING`.
# 006 also reads the stable filesystem-object identity (volume + file index)
# through `GetFileInformationByHandle`; `Win32_Security` is required because
# `CreateFileW` takes a `SECURITY_ATTRIBUTES` pointer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Used by the command-layer tests to assert the exact IPC wire shapes.
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
